name: Update NBA Schedule

on:
  schedule:
    # Every 2 hours from midnight to 08:00 Greek time (00:00, 02:00, 04:00, 06:00, 08:00),
    # while NBA games are being played and finishing. The time zone handles summer/winter
    # time automatically. GitHub can start scheduled runs a little late when it's busy.
    - cron: "0 0-8/2 * * *"
      timezone: "Europe/Athens"
  workflow_dispatch:           # also run on demand from the Actions tab

permissions:
  contents: write              # allow the job to commit schedule.json back

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild schedule.json
        run: python scripts/fetch_schedule.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update schedule.json"
            git pull --rebase
            git push
          fi
