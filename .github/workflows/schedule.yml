name: Update schedule

on:
  schedule:
    # Twice a day, after every NBA game has finished (late West Coast games end
    # around 05:00–06:15 UTC, later in winter or with overtime):
    - cron: "0 7 * * *"        # 07:00 UTC — early morning in Europe, all of last night's finals in
    - cron: "0 13 * * *"       # 13:00 UTC — safety net (GitHub sometimes delays scheduled runs)
  workflow_dispatch:           # also run on demand from the Actions tab

permissions:
  contents: write              # allow the job to commit schedule.json back

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild schedule.json
        run: python scripts/fetch_schedule.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update schedule.json"
            git pull --rebase
            git push
          fi
