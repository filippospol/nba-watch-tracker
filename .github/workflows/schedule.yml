name: Update NBA Schedule

# Backstop only. The live watcher keeps scores current through the night; this
# rebuilds the WHOLE season once each morning to catch schedule changes (new NBA
# Cup games, postponements) and anything the watcher missed.
on:
  schedule:
    - cron: "30 9 * * *"         # 09:30 Greek — after the watcher has finished
      timezone: "Europe/Athens"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild schedule.json
        run: python scripts/fetch_schedule.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update schedule.json"
            git pull --rebase --autostash
            git push
          fi
