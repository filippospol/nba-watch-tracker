fs show in your own time zone, and your stats build up as you go."><meta name="twitter:image" content="https://filippospol.github.io/nba-watch-tracker/icon.png"></head><body>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#ffffff; --fg:#141414; --muted:#737373; --faint:#b0b0b0;
    --rule:#e4e4e4; --rule-strong:#141414; --hover:#f5f5f5;
    /* Brand colours (Hack n Roll colourway). Paste the logo's exact hex values here. */
    --accent:#e03a2f;    /* red: selected month/day, watched mark */
    --accent2:#f5b800;   /* yellow: brand square, today, leaders */
    --accent-weak:rgba(224,58,47,.06);   /* faint tint behind a watched row */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121212; --fg:#ebebeb; --muted:#9a9a9a; --faint:#5e5e5e;
      --rule:#2a2a2a; --rule-strong:#ebebeb; --hover:#1a1a1a; --accent:#f0564b; --accent2:#f7c53a; --accent-weak:rgba(240,86,75,.13); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121212; --fg:#ebebeb; --muted:#9a9a9a; --faint:#5e5e5e;
    --rule:#2a2a2a; --rule-strong:#ebebeb; --hover:#1a1a1a; --accent:#f0564b; --accent2:#f7c53a; --accent-weak:rgba(240,86,75,.13); color-scheme:dark;
  }
  *{box-sizing:inherit}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px; margin:0 auto; padding:18px 16px 48px}
  button,select,input{font:inherit; color:inherit}
  button{background:none; border:1px solid var(--rule); border-radius:0; padding:3px 9px; cursor:pointer}
  button:hover{border-color:var(--fg)}
  button.link{border:0; padding:0; color:var(--muted); text-decoration:underline; text-underline-offset:2px}
  button.link:hover{color:var(--fg)}
  button:disabled{opacity:.5; cursor:default}
  select,input[type=text],input[type=email]{background:var(--bg); border:1px solid var(--rule); border-radius:0; padding:3px 7px}

  /* masthead */
  .mast{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .kicker{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px}
  .kicker::before{content:""; width:8px; height:8px; background:var(--accent2); flex:none}
  h1{font-size:20px; font-weight:600; margin:2px 0 0; letter-spacing:-.01em}
  .status{color:var(--muted); font-size:12px; margin:6px 0 0}
  .status .link{margin-left:6px}
  .authbar{font-size:12px; color:var(--muted); margin:8px 0 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .authbar input{min-width:190px; font-size:12px; padding:2px 6px}
  .authbar button{font-size:12px; padding:2px 8px}

  .tabs{display:flex; gap:18px; border-bottom:1px solid var(--rule-strong); margin:16px 0 0}
  .tabs button{border:0; padding:8px 0; margin-bottom:-1px; border-bottom:2px solid transparent; color:var(--muted)}
  .tabs button.on{color:var(--fg); border-bottom-color:var(--fg)}
  .tabs button:hover{color:var(--fg)}

  /* timezone picker */
  .tz{position:relative; display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
  .tzbtn{display:inline-flex; align-items:baseline; gap:6px; color:var(--fg)}
  .tzbtn .off{font-size:11px; color:var(--muted)}
  .tzpop{
    position:absolute; right:0; top:calc(100% + 4px); z-index:30;
    background:var(--bg); border:1px solid var(--rule-strong); width:250px; padding:6px;
  }
  .tzpop input{width:100%; margin-bottom:6px}
  .tzlist{max-height:280px; overflow-y:auto}
  .tzrow{display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:5px 6px; cursor:pointer; color:var(--fg)}
  .tzrow:hover{background:var(--hover)}
  .tzrow.on{color:var(--accent)}
  .tzrow .off{font-size:11px; color:var(--muted); white-space:nowrap}

  /* month tabs + day strip */
  .months{display:flex; gap:16px; overflow-x:auto; border-bottom:1px solid var(--rule); margin:14px 0 0; scrollbar-width:none}
  .months::-webkit-scrollbar{display:none}
  .months button{border:0; padding:8px 0; margin-bottom:-1px; border-bottom:2px solid transparent; color:var(--muted); white-space:nowrap}
  .months button.on{color:var(--fg); border-bottom-color:var(--accent)}
  .months button:hover{color:var(--fg)}
  .days{display:flex; gap:2px; overflow-x:auto; margin:8px 0 0; scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .days button{border:0; border-bottom:2px solid transparent; padding:5px 8px 6px; min-width:46px; text-align:center; line-height:1.15; color:var(--muted)}
  .days button .dw{display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase}
  .days button .dn{display:block; font-size:15px; color:var(--fg)}
  .days button .dc{display:block; font-size:10px}
  .days button.on{border-bottom-color:var(--accent)}
  .days button.on .dw,.days button.on .dc{color:var(--fg)}
  .days button.today .dn::after{content:""; display:block; width:5px; height:5px; background:var(--accent2); margin:3px auto 0}
  .days button:hover{background:var(--hover)}

  /* filters */
  .filters{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:12px 0 0; font-size:12px; color:var(--muted)}
  .seg{display:inline-flex; gap:12px}
  .seg button{border:0; padding:0; color:var(--muted)}
  .seg button.on{color:var(--fg); text-decoration:underline; text-underline-offset:3px}
  .filters .grow{flex:1}
  .filters select,.filters input{font-size:12px; padding:2px 6px}

  /* schedule rows */
  .dayhead{font-weight:600; font-size:12.5px; padding:14px 0 5px; border-bottom:1px solid var(--rule-strong); display:flex; justify-content:space-between}
  .dayhead .cnt{font-weight:400; color:var(--muted)}
  .game{display:grid; grid-template-columns:50px 1fr 24px; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--rule); cursor:pointer}
  .game:hover{background:var(--hover)}
  .game .time{color:var(--muted); font-size:12.5px}
  .game .match .at{color:var(--faint); padding:0 5px}
  .game .match .home{font-weight:500}
  .box{width:20px; height:20px; border:1.6px solid var(--faint); display:inline-block; justify-self:center; position:relative; box-sizing:border-box; transition:background-color .15s ease, border-color .15s ease}
  .game:hover .box{border-color:var(--fg)}
  .game.watched{background:var(--accent-weak); box-shadow:inset 3px 0 0 var(--accent)}
  .game.watched .box{background:var(--accent); border-color:var(--accent)}
  .game.watched .box::after{content:""; position:absolute; left:6px; top:2.5px; width:5px; height:9px; border:solid #fff; border-width:0 2.2px 2.2px 0; transform:rotate(45deg)}
  /* tick + optional "C" (condensed) badge; fixed-width column keeps ticks aligned */
  .game{position:relative}
  .mark{display:inline-flex; align-items:center; justify-content:flex-end; gap:6px; justify-self:end}
  .ctag{display:none; font-size:10px; font-weight:700; line-height:1; color:var(--accent); border:1.4px solid var(--accent); padding:2px 3px 1px; letter-spacing:.02em}
  .game.condensed .ctag, .ctag.show{display:inline-block}
  /* Full / Condensed chooser that opens on the tapped row */
  .game.choosing{background:var(--hover)}
  .wchoice{position:absolute; right:0; top:50%; transform:translateY(-50%); z-index:5; display:flex; gap:4px; padding:4px;
    background:var(--bg); border:1px solid var(--rule-strong); box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .wchoice button{font-size:12.5px; padding:6px 12px; border:1px solid var(--rule); background:var(--bg); color:var(--fg)}
  .wchoice button:hover{border-color:var(--fg)}
  .wchoice button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .wchoice .rm{color:var(--muted); padding:6px 10px}
  .split{font-style:normal; font-size:12px; color:var(--muted); margin-left:4px}
  .game.watched .time{color:var(--faint)}
  .empty{color:var(--muted); padding:24px 0; font-size:13px}

  /* calendar */
  .calnav{display:flex; align-items:baseline; gap:12px; margin:14px 0 8px}
  .calnote{font-size:11.5px; color:var(--muted); margin:-2px 0 10px}
  .calnav .mlabel{font-weight:600; font-size:15px; min-width:150px}
  .calnav button{padding:2px 8px}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--rule-strong); border-left:1px solid var(--rule)}
  .dow{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:6px 6px 4px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule)}
  .cell{min-height:62px; padding:6px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); cursor:pointer; font-size:12px}
  .cell.blank{cursor:default; background:var(--hover)}
  .cell:not(.blank):hover{background:var(--hover)}
  .cell.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .cell.today{box-shadow:inset 3px 0 0 var(--accent2)}
  .cell.today.sel{box-shadow:inset 0 0 0 1.5px var(--accent), inset 3px 0 0 var(--accent2)}
  .cell .dn{font-weight:500}
  .cell .cnt{display:block; color:var(--muted); font-size:11px; margin-top:4px}
  .cell .w{display:inline-flex; align-items:center; gap:4px; color:var(--accent); font-size:11px; margin-top:2px}
  .cell .w i{width:8px; height:8px; background:var(--accent); display:inline-block}
  .daypanel{margin-top:14px}

  /* stats */
  .totals{color:var(--muted); font-size:12px; margin:14px 0 10px}
  .conf{display:grid; grid-template-columns:1fr 1fr; gap:28px}
  @media (max-width:600px){ .conf{grid-template-columns:1fr} }
  table{border-collapse:collapse; width:100%; font-size:13.5px}
  caption{text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:0 0 6px}
  th,td{text-align:left; padding:6px 6px; border-bottom:1px solid var(--rule)}
  th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500; border-bottom:1px solid var(--rule-strong)}
  td.num,th.num{text-align:right}
  td.rk{color:var(--faint); width:24px}
  tr.lead td.rk{color:var(--fg)}
  tr.lead td.team::before{content:""; display:inline-block; width:7px; height:7px; background:var(--accent2); margin:0 7px 1px 0}

  /* ===== additions: logos, scores, now-line, badges, chart, toast ===== */
  :root{ --win:var(--fg); --chip:#efefef }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --chip:#222; color-scheme:dark } }
  :root[data-theme="dark"]{ --chip:#222; color-scheme:dark }

  .lg{width:20px; height:20px; flex:none; display:inline-block; vertical-align:middle; object-fit:contain}
  .lg.ab{display:inline-flex; align-items:center; justify-content:center; font-size:8px; font-weight:600; letter-spacing:.02em; background:var(--chip); color:var(--muted)}
  .game{grid-template-columns:52px minmax(0,1fr) auto 48px}
  .game .match{display:flex; align-items:center; flex-wrap:wrap; gap:4px 6px; min-width:0}
  .game .tm{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  .game .match .at{padding:0 1px}
  .game .time .st{display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase}
  .game .time .st.live{color:var(--accent); font-weight:600}
  .game.done .time{color:var(--faint)}
  .score{font-size:13px; white-space:nowrap; text-align:right; min-width:58px}
  .score b{font-weight:600; color:var(--win)}
  .score .l{color:var(--muted)}
  .score .dash{color:var(--faint); padding:0 3px}
  .reveal{font-size:11px; border:1px dashed var(--faint); color:var(--muted); padding:1px 7px; letter-spacing:.02em}
  .reveal:hover{color:var(--fg); border-color:var(--fg)}

  .nowline{display:flex; align-items:center; gap:8px; margin:0; padding:8px 0 6px; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:600}
  .nowline::before{content:""; width:7px; height:7px; background:var(--accent); flex:none}
  .nowline::after{content:""; flex:1; height:1.5px; background:var(--accent)}
  .days button.past .dn{color:var(--muted)}

  .switch{display:inline-flex; align-items:center; gap:7px; border:0; padding:0; color:var(--muted)}
  .switch .trk{width:26px; height:14px; border:1px solid var(--faint); position:relative; flex:none}
  .switch .trk::after{content:""; position:absolute; top:2px; left:2px; width:8px; height:8px; background:var(--faint); transition:left .15s}
  .switch[aria-checked="true"]{color:var(--fg)}
  .switch[aria-checked="true"] .trk{border-color:var(--fg)}
  .switch[aria-checked="true"] .trk::after{left:14px; background:var(--accent)}

  /* stats */
  .sumline{display:flex; flex-wrap:wrap; gap:6px 22px; margin:16px 0 4px; font-size:12.5px; color:var(--muted)}
  .sumline b{color:var(--fg); font-size:20px; font-weight:600; margin-right:5px; letter-spacing:-.01em}
  .sec{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin:24px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--rule-strong)}
  .sec h2{margin:0; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500}
  .sec .note{font-size:12px; color:var(--muted)}

  .badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
  .badge{border:1px solid var(--rule); padding:9px 10px; display:grid; grid-template-columns:30px 1fr; gap:3px 10px; align-items:center}
  .badge .mk{grid-row:span 2; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; border:1px dashed var(--faint); color:var(--faint)}
  .badge .bn{font-size:12.5px; font-weight:500; line-height:1.2}
  .badge .bd{font-size:11px; color:var(--muted); line-height:1.25}
  .badge .pg{grid-column:1 / -1; height:3px; background:var(--rule); margin-top:5px}
  .badge .pg i{display:block; height:100%; background:var(--faint)}
  .badge.on{border-color:var(--fg)}
  .badge.on .mk{background:var(--accent2); border:0; color:#141414}
  .badge.on .pg{display:none}
  .badge:not(.on) .bn{color:var(--muted)}

  .chart{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:10px}
  .crow{display:contents}
  .crow .nm{display:flex; align-items:center; gap:7px; font-size:12.5px; padding:4px 0; white-space:nowrap}
  .crow .tr{display:flex; align-items:center; gap:6px; min-width:0; border-left:1px solid var(--rule)}
  .crow .fill{height:13px; background:var(--accent); flex:none}
  .crow.top .fill{background:var(--accent2)}
  .crow .v{font-size:12px; font-weight:600}
  .crow.zero .nm{color:var(--muted)}
  .crow.zero .nm .lg{opacity:.45}
  .crow.zero .v{color:var(--faint); font-weight:400}
  /* clickable team rows -> inline list of watched games */
  .crow .nm[role=button]{cursor:pointer}
  .crow:not(.zero):hover .nm, .crow:not(.zero):hover .tr{background:var(--hover)}
  .crow .nm:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .crow .chev{color:var(--faint); display:inline-block; margin-left:1px; transition:transform .15s ease}
  .crow.open .chev{transform:rotate(90deg); color:var(--fg)}
  .crow.open .nm{font-weight:600}
  .cdetail{grid-column:1 / -1; margin:2px 0 10px; padding:10px 12px; border-left:3px solid var(--accent); background:var(--accent-weak)}
  .cdh{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:6px}
  .cdh .link{color:var(--fg); font-size:12px}
  .cdl{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:2px 18px}
  .cdl li{display:flex; gap:10px; align-items:center; font-size:12.5px; padding:3px 0}
  .cdd{color:var(--muted); min-width:86px}
  .cdm{display:inline-flex; align-items:center; gap:6px}
  .cdm .lg{width:16px; height:16px}
  .secr{display:inline-flex; align-items:baseline; gap:16px}
  .expbtn{font-size:11.5px; padding:2px 9px}

  .emptyst{border:1px dashed var(--faint); padding:28px 18px; text-align:center; margin:18px 0 6px}
  .emptyst .big{font-size:16px; font-weight:600; margin:0 0 6px}
  .emptyst p{margin:0 0 14px; color:var(--muted); font-size:13px}
  .emptyst .row{display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:14px}
  .emptyst .row .lg{width:26px; height:26px; opacity:.6}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:50; background:var(--fg); color:var(--bg); padding:9px 14px; font-size:13px; display:flex; gap:10px; align-items:center; max-width:calc(100% - 32px)}
  .toast i{width:10px; height:10px; background:var(--accent2); flex:none}
  @media (prefers-reduced-motion: no-preference){ .toast{animation:tin .25s ease-out} @keyframes tin{from{opacity:0; transform:translate(-50%,8px)}} }
  button:focus-visible,.game:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  @media (max-width:480px){
    .game{grid-template-columns:44px minmax(0,1fr) auto 46px; gap:8px}
    .game .match{flex-direction:column; align-items:flex-start; gap:3px}
    .game .match .at{display:none}
  }

</style>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* frozen header: stays pinned through the sign-in bar while the page scrolls */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:10px 0 10px; transition:box-shadow .2s ease}
  .topbar.raised{box-shadow:0 10px 18px -14px rgba(0,0,0,.4)}
  /* compact bar once you scroll: one slim row (logo, title, theme, time zone, account) */
  .topbar.compact{padding:7px 0}
  .topbar.compact .kicker, .topbar.compact .tagline{display:none}
  .topbar.compact .mast{flex-wrap:nowrap; align-items:center}
  .topbar.compact .brand{gap:9px; min-width:0}
  .topbar.compact .brand > div{min-width:0}
  .topbar.compact .brand .logo{width:28px; height:28px}
  .topbar.compact h1{font-size:16px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .topbar.compact .topright{align-items:center; flex:none}
  .topspacer{height:0}
  @media (max-width:480px){
    .topbar.compact .tz > span:first-child, .topbar.compact #tzname{display:none}   /* keep just "GMT+3 ▾" */
    .topbar.compact .topright{gap:8px}
    .topbar.compact h1{font-size:15px}
    .topbar.compact .acctbtn{max-width:104px}
  }
  .brand{display:flex; align-items:center; gap:12px}
  /* transparent all-red mark: one image, visible on both themes (no swap needed) */
  .brand .logo{width:42px; height:42px; flex:none; object-fit:contain; display:block}
  .tagline{margin:3px 0 0; font-size:12px; color:var(--muted); line-height:1.3; max-width:62ch}
  /* team focus header */

/* ---------- time helpers ---------- */
// US Eastern DST ends 2026-11-01 02:00 local. Before => EDT(UTC-4), on/after => EST(UTC-5).
const DST_END = Date.UTC(2026,10,1,2,0);
function etWallToUTCms(wall){
  const [d,t]=wall.split(" ");
  const [y,mo,da]=d.split("-").map(Number);
  const [h,mi]=t.split(":").map(Number);
  const naive=Date.UTC(y,mo-1,da,h,mi);
  const off=naive<DST_END?4:5;
  return Date.UTC(y,mo-1,da,h+off,mi);
}
function gameId(utcMs,away,home){
  const day=new Date(utcMs).toISOString().slice(0,10);
  return day+"_"+(ABBR[away]||away)+"@"+(ABBR[home]||home);
}
const keyFmt={};
function dateKey(ms,tz){ (keyFmt[tz]??=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"})); return keyFmt[tz].format(new Date(ms)); }
const timeFmt={};
function timeLabel(ms,tz){ (timeFmt[tz]??=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false})); return timeFmt[tz].format(new Date(ms)); }
const headFmt={};
function dayLabel(ms,tz){ (headFmt[tz]??=new Intl.DateTimeFormat("en-GB",{timeZone:tz,weekday:"short",day:"2-digit",month:"short",year:"numeric"})); return headFmt[tz].format(new Date(ms)); }

};

const baseScores=new Map();   // "away|home" -> [{ms, as, hs, final}] from embedded finals

    const ms=etWallToUTCms(w);
    if(as!=null && hs!=null){
      const k=a+"|"+h;
      (baseScores.get(k)||baseScores.set(k,[]).get(k)).push({ms, as, hs, final:true});
    }

  });

}

/* Pull the live schedule.json that the GitHub Action keeps fresh (new games + final

const NEAR=36*3600e3;
function findIn(list,ms){ return (list||[]).find(x=>Math.abs(x.ms-ms)<NEAR); }

/* scores docs: scores/<YYYY-MM-DD> {games:[{utc, away, home, status, as, hs}], updatedAt} */
function applyScores(docs){
  const map=new Map(); let at=0;
  const extra=[];
  const seedIdx=new Map();
  for(const g of state.seed){ const k=g.away+"|"+g.home; (seedIdx.get(k)||seedIdx.set(k,[]).get(k)).push(g); }
  for(const d of docs){
    const body=d.data()||{};
    const u=Date.parse(body.updatedAt||""); if(!isNaN(u)&&u>at) at=u;
    for(const r of (Array.isArray(body.games)?body.games:[])){
      const away=canon(String(r.away||"")), home=canon(String(r.home||""));
      const ms=Date.parse(r.utc||"");
      if(!ABBR[away]||!ABBR[home]||isNaN(ms)) continue;
      const k=away+"|"+home;
      const final=String(r.status||"").toLowerCase()==="final";
      const as=Number(r.as), hs=Number(r.hs);
      if(final && Number.isFinite(as) && Number.isFinite(hs)){
        (map.get(k)||map.set(k,[]).get(k)).push({ms,as,hs});
      }
      if(!findIn(seedIdx.get(k),ms) && !extra.some(x=>x.away===away&&x.home===home&&Math.abs(x.ms-ms)<NEAR)){
        extra.push({id:gameId(ms,away,home),ms,away,home});
      }

}

function scoreFor(g){ return findIn(state.scores.get(g.away+"|"+g.home),g.ms)||findIn(baseScores.get(g.away+"|"+g.home),g.ms)||null; }

function phase(g,now){
  if(scoreFor(g)) return "final";
  if(now>=g.ms+GAME_LEN) return "final";
  if(now>=g.ms) return "live";
  return "upcoming";
}

function ago(ts){
  if(!ts) return "";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  const m=Math.floor(s/60); if(m<60) return m+" min ago";
  const h=Math.floor(m/60); if(h<24) return h+" h ago";
  return Math.floor(h/24)+" d ago";
}

  const parts=[`${fmtN(n)} games through ${last}`];

  parts.push(syncLabel());

/* ==================== account sync: identical lists on every device ====================
   How it stays consistent:
   • Each device keeps only ITS OWN unsaved changes ("pending": game -> full / condensed / removed).
   • To save, it re-reads the account, applies just those changes on top, and writes back only if
     nobody else saved in between (compare-and-swap on updated_at); otherwise it re-reads and retries.
     So a device that has been open for days can never wipe out what another device saved.
   • What you see = the account + this device's pending changes. It refreshes when the app comes
     back into view, when the connection returns, and every 90 s while open.
   • Pending changes are kept on this device until saved (survive refresh / closed tab / offline). */
let pending=new Map();          // gameId -> "full" | "condensed" | null (removed), not yet in the account

const pendKey=()=>currentUser?("nba_pending_"+currentUser.id):null;
function persistPending(){
  const k=pendKey(); if(!k) return;           // logged-out ticks are never stored
  try{ if(pending.size||pendingPrefs) store.set(k,{ops:[...pending],prefs:pendingPrefs}); else localStorage.removeItem(k); }catch(e){}

function restorePending(){
  const k=pendKey(); if(!k) return;
  const v=store.get(k,null);
  if(v && Array.isArray(v.ops)){
    for(const op of v.ops){
      if(!Array.isArray(op)) continue;
      const id=String(op[0]), t=(op[1]==="full"||op[1]==="condensed")?op[1]:null;
      if(!pending.has(id)) pending.set(id,t);

    if(v.prefs) pendingPrefs=true;
  }
}
/* Last copy of the account seen on this device: lets the list show instantly and offline.
   It's only ever a starting point — the account itself is re-read and always wins. */
/* `base` = the account exactly as this device last saw it, with its version stamp (updated_at).
   Knowing the version lets the app ask "has anything changed?" (a reply of a few bytes) instead of
   downloading the whole list, and save without downloading first — keeping Supabase data transfer tiny. */
let base=null;                  // {w:Set, c:Set, prefs:obj|null, ver:string|null, exists:bool}
const cacheKey=()=>currentUser?("nba_cache_"+currentUser.id):null;
function saveCache(){
  const k=cacheKey(); if(!k || !base) return;

function setBase(data){

function sameVer(a,b){

function showCached(){

  const v=store.get(k,null);
  const w=cleanIds(v&&v.w), c=cleanIds(v&&v.c);
  for(const id of [...c]) if(!w.has(id)) c.delete(id);
  // Only a cache written by this version (with a version stamp) can stand in for the account.
  if(v && typeof v.exists==="boolean" && (v.ver===null || typeof v.ver==="string"))
    base={ w:new Set(w), c:new Set(c), prefs:(v.prefs && typeof v.prefs==="object")?v.prefs:null, ver:v.ver, exists:v.exists };
  applyOps(w,c,pending);

function cleanIds(a){ return new Set(Array.isArray(a)?a.filter(x=>typeof x==="string"||typeof x==="number").map(String):[]); }
function applyOps(w,c,ops){

    if(t){ w.add(id); if(t==="condensed") c.add(id); else c.delete(id); }
    else { w.delete(id); c.delete(id); }

function changedIds(oldW,oldC,newW,newC){
  const out=new Set();
  for(const id of oldW) if(!newW.has(id)) out.add(id);
  for(const id of newW) if(!oldW.has(id)) out.add(id);
  for(const id of oldC) if(!newC.has(id)) out.add(id);
  for(const id of newC) if(!oldC.has(id)) out.add(id);
  return [...out];
}

function showSynced(w,c,fullRender){

/* Only a genuinely missing column (not a network blip) switches an optional column off. */
function dropOptionalColumn(err){
  const m=((err&&err.message)||"").toLowerCase(), code=String((err&&err.code)||"");
  if(!(code==="42703" || code==="PGRST204" || m.includes("column"))) return false;
  if(casSupported && m.includes("updated_at")){ casSupported=false; return true; }
  if(condensedSupported && m.includes("condensed")){ condensedSupported=false; return true; }
  if(prefsSupported && m.includes("prefs")){ prefsSupported=false; return true; }
  return false;

async function readCloud(uid){
  for(let attempt=0; attempt<4; attempt++){
    const cols=["watched"].concat(casSupported?["updated_at"]:[], prefsSupported?["prefs"]:[], condensedSupported?["condensed"]:[]).join(", ");
    const { data, error } = await sb.from("trackers").select(cols).eq("user_id", uid).maybeSingle();
    if(!error) return data;                         // null = no row yet
    if(!dropOptionalColumn(error)) throw error;
  }
  throw new Error("could not read account");
}
function cloudSets(data){
  const w=cleanIds(data&&data.watched), c=cleanIds(data&&data.condensed);
  for(const id of [...c]) if(!w.has(id)) c.delete(id);          // condensed is always a subset of watched
  return [w,c];
}
function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer=setTimeout(()=>{ if(!currentUser) return; if(cloudReady) saveNow(); else pullCloud(); }, retryDelay);
  retryDelay=Math.min(retryDelay*2, 60000);

/* Read the account and show it (plus this device's unsaved changes on top). */
let netStats={probes:0, reads:0, writes:0};   // handy for checking usage in the browser console
async function pullCloud(){
  if(!sb || !currentUser) return;
  const uid=currentUser.id; lastPull=Date.now();
  try{
    let fresh=false;
    if(casSupported && base){                   // 1) tiny request: just the version stamp
      netStats.probes++;
      const { data, error } = await sb.from("trackers").select("updated_at").eq("user_id", uid).maybeSingle();
      if(error){ if(!dropOptionalColumn(error)) throw error; }
      else fresh = base.exists ? !!(data && sameVer(data.updated_at, base.ver)) : !data;
    }
    if(!currentUser || currentUser.id!==uid) return;            // signed out / switched meanwhile
    if(!fresh){                                  // 2) only if something changed: download the list
      netStats.reads++;
      const data=await readCloud(uid);
      if(!currentUser || currentUser.id!==uid) return;
      setBase(data);
    }
  }catch(e){ failSync(); return; }
  const w=new Set(base.w), c=new Set(base.c);
  applyOps(w,c,pending);
  const before=collectPrefs();
  const cp=base.prefs;
  if(cp && Object.keys(cp).length){ if(!pendingPrefs) applyPrefs(cp); }   // the account's settings win
  else if(prefsSupported && !cloudReady){ pendingPrefs=true; prefsVer++; } // account has none yet: save this device's
  const after=collectPrefs();
  const first=!cloudReady; cloudReady=true;
  if(syncState==="offline"||syncState==="error"||syncState==="idle") setSync(pending.size||pendingPrefs?"saving":"saved");
  showSynced(w,c, first || after.region!==before.region || after.hideScores!==before.hideScores);
  if(pending.size||pendingPrefs) queueSave();
}
function pullSoon(){ if(currentUser && cloudReady && !saving && Date.now()-lastPull>3000) pullCloud(); }

function queueSave(){
  if(!sb || !currentUser || !cloudReady) return;             // logged out, or account not loaded yet
  if(!pending.size && !pendingPrefs) return;
  setSync("saving");

  writeTimer=setTimeout(saveNow,400);
}
/* Merge this device's changes into the latest account data and write it back safely. */
async function saveNow(){
  clearTimeout(writeTimer);
  if(!sb || !currentUser || !cloudReady) return;
  if(saving){ saveAgain=true; return; }
  if(!pending.size && !pendingPrefs){ setSync("saved"); return; }
  saving=true; setSync("saving");
  const uid=currentUser.id;
  const ops=new Map(pending), prefsDirty=pendingPrefs, pv=prefsVer;   // what this attempt commits
  let ok=false;
  try{
    let needRead=!base;
    for(let attempt=0; attempt<6 && !ok; attempt++){
      // Normally no download: write on top of the version we already have. The write only
      // succeeds if nobody saved since (compare-and-swap); if they did, download once and retry.
      if(needRead || !casSupported){
        netStats.reads++;
        const data=await readCloud(uid);
        if(!currentUser || currentUser.id!==uid) return;
        setBase(data);
      }
      needRead=true;                                          // unless told otherwise, re-read before a retry
      const w=new Set(base.w), c=new Set(base.c);
      applyOps(w,c,ops);
      const row={ watched:[...w] };
      if(casSupported) row.updated_at=new Date().toISOString();
      if(condensedSupported) row.condensed=[...c];
      if(prefsSupported && prefsDirty) row.prefs=collectPrefs();
      const back=casSupported?"updated_at":"user_id";         // the reply is just the new version stamp
      let res; netStats.writes++;
      if(!base.exists){
        res=await sb.from("trackers").insert({ user_id:uid, ...row }).select(back);
        if(res.error){ if(res.error.code==="23505") continue; if(dropOptionalColumn(res.error)){ needRead=false; continue; } throw res.error; }
      }else if(casSupported){
        let q=sb.from("trackers").update(row).eq("user_id",uid);
        q = (base.ver==null) ? q.is("updated_at",null) : q.eq("updated_at",base.ver);
        res=await q.select(back);
        if(res.error){ if(dropOptionalColumn(res.error)){ needRead=false; continue; } throw res.error; }
        if(!res.data || !res.data.length) continue;           // someone else saved in between -> re-read, merge again
      }else{
        res=await sb.from("trackers").upsert({ user_id:uid, ...row });
        if(res.error){ if(dropOptionalColumn(res.error)){ needRead=false; continue; } throw res.error; }
      }
      if(!currentUser || currentUser.id!==uid) return;
      ok=true;
      const got=res.data && res.data[0] && res.data[0].updated_at;
      base={ w, c, prefs:row.prefs || base.prefs, ver:casSupported ? String(got || row.updated_at) : null, exists:true };
      saveCache();
      // Committed: forget the changes we just saved (unless they were changed again meanwhile).
      for(const [id,t] of ops) if(pending.has(id) && pending.get(id)===t) pending.delete(id);
      if(prefsDirty && prefsVer===pv) pendingPrefs=false;
      persistPending();
      const vw=new Set(w), vc=new Set(c); applyOps(vw,vc,pending);   // other devices' changes now shown too
      showSynced(vw,vc,false);

    }
    if(!ok) throw new Error("save conflict");
    setSync(pending.size||pendingPrefs?"saving":"saved");
  }catch(e){
    failSync();
  }finally{
    saving=false;
    if((saveAgain || pending.size || pendingPrefs) && syncState==="saving" && currentUser){ saveAgain=false; queueSave(); }
    saveAgain=false;
  }
}
/* Wait for outstanding changes to reach the account (used before signing out). */
async function flushSave(){
  for(let i=0; i<40 && (saving || pending.size || pendingPrefs); i++){
    if(!saving) await saveNow(); else await new Promise(r=>setTimeout(r,150));
    if(syncState==="error" || syncState==="offline") break;

  return !(pending.size || pendingPrefs);

["pointerdown","keydown","wheel","touchstart"].forEach(ev=>window.addEventListener(ev,()=>{
  const wasIdle=Date.now()-lastActive>IDLE_MS; lastActive=Date.now(); if(wasIdle) pullSoon();
},{passive:true}));
setInterval(()=>{ if(document.visibilityState==="visible" && Date.now()-lastActive<IDLE_MS) pullSoon(); }, 90000);

/* ---------- account button + dedicated login screen (email + password) ---------- */
function updateAccountBtn(){
  const b=document.getElementById("acctbtn");
  if(!b) return;
  if(!sb){ b.hidden=true; return; }            // not configured -> no account button
  b.hidden=false;
  if(currentUser){ const u=userName(); b.textContent=u?"@"+u:"Account"; b.title=u?"Account":""; b.classList.add("in"); }
  else{ b.textContent="Sign in"; b.title=""; b.classList.remove("in"); }
}
function friendlyAuthError(error){
  const m=((error&&error.message)||"").toLowerCase();
  if(m.includes("invalid login")) return "That email or password doesn't match.";
  if(m.includes("rate limit")||m.includes("too many")) return "Too many attempts — wait a few minutes and try again.";
  if(m.includes("already registered")||m.includes("already been registered")||m.includes("user already")) return "That email already has an account — switch to Sign in.";
  if(m.includes("password")&&m.includes("6")) return "Password must be at least 6 characters.";
  if(m.includes("valid email")||(m.includes("email")&&m.includes("invalid"))) return "Enter a valid email address.";
  if(m.includes("not confirmed")) return "Confirm your email first — check your inbox.";
  if(m.includes("invalid username")||/database error (saving new|updating) user/.test(m)) return "That username is taken or not allowed. Use "+USERNAME_HINT;
  return (error&&error.message) || "Something went wrong — try again.";
}
/* Username helpers — server functions from supabase/usernames.sql. If they aren't installed yet,
   the app quietly falls back to email-only sign-in (the database still enforces the rules). */
function rpcMissing(e){
  const c=String((e&&e.code)||""), m=((e&&e.message)||"").toLowerCase();
  return c==="PGRST202" || c==="42883" || m.includes("could not find the function");
}
async function usernameAvailable(name){          // true / false, or null if it couldn't be checked
  try{ const { data, error } = await sb.rpc("username_available",{ u:name }); return error ? null : data===true; }
  catch(e){ return null; }
}
async function emailForUsername(name,pass){      // the account's email, only if the password is right
  let res;
  try{ res=await sb.rpc("email_for_login",{ u:name, p:pass }); }catch(e){ return { err:"Couldn't reach the server — check your connection." }; }
  const { data, error } = res;
  if(error){
    if(rpcMissing(error)) return { err:"Signing in with a username isn't switched on yet — use your email." };
    if(((error.message)||"").toLowerCase().includes("too many attempts")) return { err:"Too many tries for that username. Wait 15 minutes, or sign in with your email." };
    return { err:friendlyAuthError(error) };
  }
  return data ? { email:String(data) } : { err:"That username or password doesn't match." };
}
function renderLogin(){
  const el=document.getElementById("logincontent");
  if(!el) return;

  /* --- after a reset link: set a new password --- */
  if(loginMode==="recovery"){
    el.innerHTML =
      `<h2>Set a new password</h2>`
      + `<p>Choose a new password for your account.</p>`
      + `<div class="field">`
      +   `<input id="newpass" type="password" placeholder="New password (6+ characters)" autocomplete="new-password">`
      +   `<button class="cta" id="savepass" type="button">Save password</button>`
      + `</div>`
      + `<div class="loginmsg" id="authmsg"></div>`;
    const pass=el.querySelector("#newpass"), msg=el.querySelector("#authmsg"), btn=el.querySelector("#savepass");
    const save=async ()=>{
      if((pass.value||"").length<6){ msg.className="loginmsg"; msg.textContent="Password must be at least 6 characters."; return; }
      btn.disabled=true; msg.className="loginmsg"; msg.textContent="Saving…";
      const { error } = await sb.auth.updateUser({ password: pass.value });
      btn.disabled=false;
      if(error){ msg.className="loginmsg"; msg.textContent=friendlyAuthError(error); return; }
      loginMode="signin"; closeLogin(); toast("Password updated — you're signed in");
    };
    btn.onclick=save; pass.onkeydown=e=>{ if(e.key==="Enter") save(); };
    setTimeout(()=>pass.focus(),40);
    return;
  }

  /* --- signed in --- */
  if(currentUser){
    const u=userName();
    el.innerHTML =
      `<h2>${u?"@"+esc(u):"You're signed in"}</h2>`
      + `<p>Your watched games and settings (time zone, theme, hide scores) are saved to your account and sync across your devices.<br><span class="acctemail">${esc(currentUser.email||"")}</span></p>`
      + `<div class="field">`
      +   `<label class="flabel" for="acctuser">Username</label>`
      +   `<input id="acctuser" type="text" placeholder="username" autocomplete="username" maxlength="20" value="${esc(u)}" spellcheck="false" autocapitalize="off">`
      +   `<button class="cta ghost" id="saveuser" type="button">${u?"Update username":"Save username"}</button>`
      + `</div>`
      + `<div class="loginmsg" id="authmsg"></div>`
      + `<div class="field" style="margin-top:14px"><button class="cta" id="signout" type="button">Sign out</button></div>`
      + `<button class="loginskip" id="logindone" type="button">Done</button>`;
    const inp=el.querySelector("#acctuser"), msg=el.querySelector("#authmsg"), sv=el.querySelector("#saveuser");
    wireUsernameInput(inp,msg);
    const saveUser=async ()=>{
      const name=(inp.value||"").trim();
      if(!USERNAME_RE.test(name)){ msg.className="loginmsg"; msg.textContent=USERNAME_HINT; return; }
      if(name===u){ msg.className="loginmsg"; msg.textContent="That's already your username."; return; }
      sv.disabled=true; msg.className="loginmsg"; msg.textContent="Saving…";
      if(await usernameAvailable(name)===false){ sv.disabled=false; msg.textContent="That username is taken — try another."; return; }
      const { data, error } = await sb.auth.updateUser({ data:{ username:name } });
      sv.disabled=false;
      if(error){ msg.className="loginmsg"; msg.textContent=friendlyAuthError(error); return; }
      if(data && data.user) currentUser=data.user;
      updateAccountBtn(); renderLogin(); toast("Username saved");
    };
    sv.onclick=saveUser; inp.onkeydown=e=>{ if(e.key==="Enter") saveUser(); };
    el.querySelector("#signout").onclick=async (ev)=>{
      const b=ev.currentTarget; b.disabled=true; b.textContent="Saving…";
      const ok=await flushSave();                 // make sure this device's changes reached the account
      if(!ok && !confirm("Some changes haven't reached your account yet (you may be offline).\n\nSign out anyway? They'll stay on this device and sync the next time you sign in here.")){
        b.disabled=false; b.textContent="Sign out"; return;
      }
      try{ localStorage.removeItem("nba_cache_"+currentUser.id); }catch(e){}   // nothing of this account left behind
      await sb.auth.signOut(); closeLogin();
    };
    el.querySelector("#logindone").onclick=closeLogin;
    return;
  }

  /* --- sign in / create account (email + password) --- */
  const signup = loginMode==="signup";
  el.innerHTML =
    `<div class="authtabs">`
    +  `<button class="authtab${signup?"":" on"}" data-m="signin" type="button">Sign in</button>`
    +  `<button class="authtab${signup?" on":""}" data-m="signup" type="button">Create account</button>`
    + `</div>`
    + `<h2>${signup?"Create your account":"Welcome back"}</h2>`
    + `<p>${signup?"Sign up to save the games you've watched and sync them across every device.":"Sign in to pick your tracker back up on any device."}</p>`
    + `<div class="field">`
    +   (signup?`<input id="authuser" type="text" placeholder="Username (shown on your shared season)" autocomplete="username" maxlength="20" spellcheck="false" autocapitalize="off">`:``)
    +   (signup
          ? `<input id="authemail" type="email" placeholder="you@email.com" autocomplete="email" inputmode="email">`
          : `<input id="authemail" type="text" placeholder="Email or username" autocomplete="username" spellcheck="false" autocapitalize="off" autocorrect="off">`)
    +   `<input id="authpass" type="password" placeholder="Password" autocomplete="${signup?"new-password":"current-password"}">`
    +   `<button class="cta" id="authgo" type="button">${signup?"Create account":"Sign in"}</button>`
    + `</div>`
    + `<div class="loginmsg" id="authmsg"></div>`
    + (signup?``:`<button class="loginlink" id="forgot" type="button">Forgot password?</button>`)
    + `<button class="loginskip" id="loginskip" type="button">Continue browsing without saving</button>`;

  const emailEl=el.querySelector("#authemail"), passEl=el.querySelector("#authpass"),
        msg=el.querySelector("#authmsg"), btn=el.querySelector("#authgo");

  el.querySelectorAll(".authtab").forEach(t=>t.onclick=()=>{ loginMode=t.dataset.m; renderLogin(); });

  const userEl=el.querySelector("#authuser");
  wireUsernameInput(userEl,msg);
  const go=async ()=>{
    let email=(emailEl.value||"").trim();
    const pass=(passEl.value||""), uname=userEl?(userEl.value||"").trim():"";
    if(signup && !USERNAME_RE.test(uname)){ msg.className="loginmsg"; msg.textContent="Pick a username: "+USERNAME_HINT; return; }
    if(!email){ msg.className="loginmsg"; msg.textContent=signup?"Enter your email.":"Enter your email or username."; return; }
    const byUsername = !signup && (!email.includes("@") || /^@[A-Za-z0-9_.]{3,20}$/.test(email));   // "@name" works too
    if(byUsername && !USERNAME_RE.test(email.replace(/^@/,""))){ msg.className="loginmsg"; msg.textContent="Enter your email, or a username like filippos_23."; return; }
    if(pass.length<6){ msg.className="loginmsg"; msg.textContent="Password must be at least 6 characters."; return; }
    btn.disabled=true; msg.className="loginmsg"; msg.textContent=signup?"Creating account…":"Signing in…";
    if(signup){
      if(await usernameAvailable(uname)===false){ btn.disabled=false; msg.textContent="That username is taken — try another."; return; }
      const { data, error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ username: uname }, emailRedirectTo: APP_URL() } });
      btn.disabled=false;
      if(error){ msg.className="loginmsg"; msg.textContent=friendlyAuthError(error); return; }
      if(!(data && data.session)){            // email confirmation is ON -> one-time verify email
        msg.className="loginmsg ok"; msg.textContent="Account created — check your email to confirm, then sign in.";
      }                                        // else: confirmation OFF -> SIGNED_IN closes the screen
    }else{
      if(byUsername){                          // username -> look up the email (needs the right password)
        const r=await emailForUsername(email.replace(/^@/,""), pass);
        if(r.err){ btn.disabled=false; msg.className="loginmsg"; msg.textContent=r.err; return; }
        email=r.email;
      }
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      btn.disabled=false;
      if(error){ msg.className="loginmsg"; msg.textContent=byUsername && /invalid login/i.test(error.message||"") ? "That username or password doesn't match." : friendlyAuthError(error); return; }
      // success -> SIGNED_IN handler closes the screen and syncs
    }
  };
  btn.onclick=go;
  emailEl.onkeydown=e=>{ if(e.key==="Enter") passEl.focus(); };
  if(userEl) userEl.onkeydown=e=>{ if(e.key==="Enter") emailEl.focus(); };
  passEl.onkeydown=e=>{ if(e.key==="Enter") go(); };

  const forgot=el.querySelector("#forgot");
  if(forgot) forgot.onclick=async ()=>{
    const email=(emailEl.value||"").trim();
    if(!email || !email.includes("@")){ msg.className="loginmsg"; msg.textContent="Type your email (not your username) above, then tap Forgot password."; return; }
    msg.className="loginmsg"; msg.textContent="Sending reset link…";
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL() });
    msg.className = error ? "loginmsg" : "loginmsg ok";
    msg.textContent = error ? friendlyAuthError(error) : "Check your email for a password-reset link.";
  };

  el.querySelector("#loginskip").onclick=closeLogin;
  setTimeout(()=>(userEl||emailEl).focus(),40);
}

/* ---------- region selector (custom dropdown, live GMT offsets) ---------- */
const offCache={};
function gmtLabel(tz){
  if(offCache[tz]!==undefined) return offCache[tz];
  let out="";
  try{
    const parts=new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"shortOffset"}).formatToParts(new Date());
    const p=parts.find(x=>x.type==="timeZoneName");
    out=(p&&p.value)||"GMT";
    out=out.replace(/:00$/,"");
    if(out==="GMT") out="GMT+0";
  }catch(e){ out=""; }
  offCache[tz]=out; return out;
}
function currentLabel(){ const z=ZONES.find(z=>z[1]===state.region); return z?z[0]:state.region; }
function renderTzButton(){
  document.getElementById("tzname").textContent=currentLabel();
  document.getElementById("tzoff").textContent=gmtLabel(state.region);
}
function renderTzList(q){
  const ql=(q||"").trim().toLowerCase();
  const rows=ZONES.filter(z=>!ql||z[0].toLowerCase().includes(ql));
  const list=document.getElementById("tzlist");
  list.innerHTML=rows.length
    ? rows.map(([label,tz])=>`<div class="tzrow${tz===state.region?" on":""}" data-tz="${tz}"><span>${label}</span><span class="off">${gmtLabel(tz)}</span></div>`).join("")
    : `<div class="tzrow"><span>No match</span></div>`;
  list.querySelectorAll(".tzrow[data-tz]").forEach(r=>r.onclick=()=>{
    state.region=r.dataset.tz; store.set("nba_region",state.region);
    state.cal=null; state.selDay=null;
    closeTz(); renderTzButton(); render(); prefsChanged();
  });
}

/* ---------- grouping ---------- */
function groupByDay(games){
  const m=new Map();
  for(const g of games){ const k=dateKey(g.ms,state.region); (m.get(k)||m.set(k,[]).get(k)).push(g); }
  return m;
}
/* ---------- marking a game: Full / Condensed ----------
   Watched = state.watched (what every stat counts). Condensed = a subset flag on top.  */
function rowEl(id){ const sel=(window.CSS&&CSS.escape)?CSS.escape(id):id; return document.querySelector(`#view .game[data-id="${sel}"]`); }
function markTitle(on,c){ return c?"Watched · condensed":on?"Watched · full game":"Mark as watched"; }
function paintRow(el,id){
  const on=state.watched.has(id), c=on&&state.condensed.has(id);
  el.classList.toggle("watched",on); el.classList.toggle("condensed",c);
  el.setAttribute("aria-checked",on?"true":"false");
  const m=el.querySelector(".mark"); if(m) m.title=markTitle(on,c);
}
function setWatched(id,type){                     // type: "full" | "condensed" | null (remove)
  const before=badgeState();
  const was=state.watched.has(id);
  if(type){ state.watched.add(id); if(type==="condensed") state.condensed.add(id); else state.condensed.delete(id); }
  else{ state.watched.delete(id); state.condensed.delete(id); }
  pending.set(id, type||null);                    // remember this change until the account has it
  persistPending();                               // (kept on this device only when signed in)
  queueSave();                                    // writes to the account only when signed in
  if(type && !was && !currentUser) nudgeSignIn(); // logged out -> this mark won't be saved
  const after=badgeState();
  const fresh=BADGES.filter(b=>after[b.id].done&&!before[b.id].done);
  if(fresh.length) toast(`Badge unlocked: ${fresh[fresh.length-1].name}`);
  // In a list with no watched/unwatched filter, update the one row in place so the
  // scroll position and lazily-loaded content are kept. Otherwise re-render.
  if((state.view==="list"||state.view==="preseason") && state.wfilter==="all"){
    const el=rowEl(id); if(el) paintRow(el,id);
    updateTeamHeaderCounts();
  }else{
    render();
  }
}
function closeChooser(focusRow){
  const open=document.querySelector(".game.choosing");
  if(!open) return;
  open.classList.remove("choosing");
  const w=open.querySelector(".wchoice"); if(w) w.remove();
  if(focusRow) open.focus();
}
function openChooser(el,fromKey){
  const id=el.dataset.id;
  if(el.classList.contains("choosing")){ closeChooser(fromKey); return; }
  closeChooser();
  const on=state.watched.has(id), c=on&&state.condensed.has(id);
  const w=document.createElement("span");
  w.className="wchoice"; w.setAttribute("role","group"); w.setAttribute("aria-label","Mark this game as watched");
  w.innerHTML=`<button type="button" data-w="full" class="${on&&!c?"on":""}" aria-pressed="${on&&!c}">Full</button>`
    +`<button type="button" data-w="condensed" class="${c?"on":""}" aria-pressed="${c}">Condensed</button>`
    +(on?`<button type="button" data-w="remove" class="rm" aria-label="Remove from watched" title="Remove">&times;</button>`:"");
  w.onclick=e=>{
    e.stopPropagation();
    const b=e.target.closest("button[data-w]"); if(!b) return;
    const k=b.dataset.w;
    closeChooser();
    setWatched(id, k==="remove"?null:k);
    if(fromKey){ const r=rowEl(id); if(r) r.focus(); }
  };
  w.onkeydown=e=>{ if(e.key==="Escape"){ e.stopPropagation(); closeChooser(true); } else e.stopPropagation(); };
  el.appendChild(w); el.classList.add("choosing");
  if(fromKey){ const first=w.querySelector("button"); if(first) first.focus(); }
}
document.addEventListener("click",e=>{ if(!e.target.closest(".game.choosing")) closeChooser(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeChooser(true); });

/* ---------- rows ---------- */
function scoreCell(g,ph){
  if(ph!=="final") return `<span class="score"></span>`;
  const s=scoreFor(g);
  if(!s) return `<span class="score"></span>`;
  if(state.hideScores && !state.revealed.has(g.id))
    return `<span class="score"><button class="reveal" data-reveal="${g.id}" type="button" aria-label="Show final score">Score</button></span>`;
  const aw=s.as>s.hs, hw=s.hs>s.as;
  return `<span class="score">${aw?`<b>${s.as}</b>`:`<span class="l">${s.as}</span>`}<span class="dash">–</span>${hw?`<b>${s.hs}</b>`:`<span class="l">${s.hs}</span>`}</span>`;
}
function gameRow(g,now){
  now=(now>1e12)?now:Date.now();     // also called via Array.map, where the 2nd arg is an index
  const on=state.watched.has(g.id), c=on&&state.condensed.has(g.id);
  const ph=phase(g,now);
  const st=ph==="final"?`<span class="st">Final</span>`:ph==="live"?`<span class="st live">Live</span>`:"";
  return `<div class="game${on?" watched":""}${c?" condensed":""}${ph==="final"?" done":""}" data-id="${g.id}" tabindex="0" role="checkbox" aria-checked="${on}">
    <span class="time">${timeLabel(g.ms,state.region)}${st}</span>
    <span class="match"><span class="tm">${logo(g.away)}${short(g.away)}</span><span class="at">@</span><span class="tm home">${logo(g.home)}${short(g.home)}</span></span>
    ${scoreCell(g,ph)}
    <span class="mark" title="${markTitle(on,c)}"><span class="ctag" aria-hidden="true">C</span><span class="box" aria-hidden="true"></span></span>
  </div>`;
}
const NOWLINE=`<div class="nowline" role="separator">Now</div>`;
function passes(g){
  if(state.team && g.away!==state.team && g.home!==state.team) return false;
  if(state.wfilter==="watched" && !state.watched.has(g.id)) return false;
  if(state.wfilter==="unwatched" && state.watched.has(g.id)) return false;
  if(state.search){ const q=state.search.toLowerCase(); if(!(g.away+" "+g.home).toLowerCase().includes(q)) return false; }
  return true;
}
const wdFmt={};
function weekday(ms,tz){ (wdFmt[tz]??=new Intl.DateTimeFormat("en-GB",{timeZone:tz,weekday:"short"})); return wdFmt[tz].format(new Date(ms)); }
function monthLabel(mk,long){
  const [y,m]=mk.split("-").map(Number);
  return new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",month:long?"long":"short"}).format(new Date(Date.UTC(y,m-1,1)));
}
function dayCount(n){ return n+(n===1?" game":" games"); }

/* Build day-blocks as an array (one HTML string per day), dropping the "Upcoming" rule
   before the first unfinished game when finished games sit above it in the list. */
function dayBlocksArr(keys,groups,filter){
  const now=Date.now(); const blocks=[]; let sawDone=false, placed=false, any=false;
  for(const k of keys){
    const gs=(groups.get(k)||[]).filter(filter);
    if(!gs.length) continue; any=true;
    const head=`<div class="dayhead" data-dk="${k}"><span>${dayLabel(gs[0].ms,state.region)}</span><span class="cnt">${dayCount(gs.length)}</span></div>`;
    let pre="", rows="";
    for(let i=0;i<gs.length;i++){
      const g=gs[i], done=phase(g,now)==="final";
      if(done) sawDone=true;
      else if(sawDone && !placed){ placed=true; if(i===0) pre=NOWLINE; else rows+=NOWLINE; }
      rows+=gameRow(g,now);
    }
    blocks.push(pre+head+rows);
  }
  return {blocks,any};
}

/* Lazy mount: render the first chunk of day-blocks, then append the rest as a sentinel
   scrolls into view — keeps a whole-season list smooth on phones. */
let _lazyObs=null, _lazyMore=null, _lazyDone=true;
function mountBlocks(listEl, blocks){
  if(_lazyObs){ _lazyObs.disconnect(); _lazyObs=null; }
  const CHUNK=24; let i=0; _lazyDone=false;
  const sentinel=document.createElement("div"); sentinel.className="lazysent"; sentinel.setAttribute("aria-hidden","true");
  listEl.appendChild(sentinel);
  function more(){
    const tmp=document.createElement("div");
    tmp.innerHTML=blocks.slice(i,i+CHUNK).join("");
    wireGames(tmp);                                   // wire only the newly built rows
    while(tmp.firstChild) listEl.insertBefore(tmp.firstChild, sentinel);
    i+=CHUNK;
    if(i>=blocks.length){ _lazyDone=true; if(_lazyObs){_lazyObs.disconnect();_lazyObs=null;} sentinel.remove(); }
  }
  _lazyMore=more;
  more();
  if(i<blocks.length){
    _lazyObs=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) more(); }, {rootMargin:"800px"});
    _lazyObs.observe(sentinel);
  }else _lazyDone=true;
}
/* In the All-season list, force-load forward until today's day appears, then scroll to it. */
function jumpToToday(){
  const list=document.getElementById("gamelist"); if(!list) return;
  const todayK=dateKey(Date.now(),state.region);
  const target=()=>[...list.querySelectorAll(".dayhead[data-dk]")].find(h=>h.dataset.dk>=todayK);
  let t=target(), guard=0;
  while(!t && !_lazyDone && _lazyMore && guard++<400){ _lazyMore(); t=target(); }
  if(t) t.scrollIntoView({block:"start", behavior:"smooth"});
}

/* ---------- team focus: a header + that team's whole-season schedule ---------- */
function teamStats(T){
  const now=Date.now();
  let total=0,w=0,l=0,watched=0,next=null;
  for(const g of viewGames()){
    if(g.away!==T && g.home!==T) continue;
    total++;
    if(state.watched.has(g.id)) watched++;
    if(phase(g,now)==="final"){
      const s=scoreFor(g);
      if(s){ const win=(g.away===T)?s.as>s.hs:s.hs>s.as; if(win) w++; else l++; }
    }else if(!next && g.ms>now){ next=g; }
  }
  return {total,w,l,watched,next};
}
function teamHeaderHtml(T){
  const st=teamStats(T);
  const rec=(st.w||st.l)?`${st.w}&ndash;${st.l}`:"&mdash;";
  const nxt=st.next
    ? `<div class="tnext">Next &middot; ${dayLabel(st.next.ms,state.region)} &middot; ${short(st.next.away)} @ ${short(st.next.home)} &middot; ${timeLabel(st.next.ms,state.region)}</div>`
    : `<div class="tnext">No upcoming games left this season</div>`;
  return `<div class="teamhdr">
    <span class="tlogo">${logo(T)}</span>
    <div class="tmeta">
      <div class="tname">${T}</div>
      <div class="tstat">${EAST.has(T)?"Eastern":"Western"} &middot; <b>${rec}</b> record &middot; <b id="team-watched">${st.watched}</b> of ${st.total} watched</div>
    </div>
    <button class="tclear" id="f-clearteam" type="button">&times; All teams</button>
    ${nxt}
  </div>`;
}

    if(state.month==="all"){
      // whole season, lazy-loaded; day strip replaced by a Jump-to-today control
      const allTotal=allDayKeys.reduce((n,k)=>n+groups.get(k).length,0);
      top = `<div class="months">${months}</div>`
          + `<div class="allbar"><button class="link" id="f-today" type="button">Jump to today &darr;</button><span class="allcount">${fmtN(allTotal)} games &middot; whole season</span></div>`
          + filters;

    }else{

      if(state.day && !dayKeys.includes(state.day)) state.day=null;

        + dayKeys.map(k=>{ const gs=groups.get(k);

      top = `<div class="months">${months}</div><div class="days">${days}</div>` + filters;
      listKeys = state.day?[state.day]:dayKeys;

  const {blocks,any}=dayBlocksArr(listKeys,groups,passes);
  v.innerHTML = top + `<div class="gamelist" id="gamelist"></div>` + (any?``:`<div class="empty">Nothing matches.</div>`);

  v.querySelectorAll(".months button").forEach(b=>b.onclick=()=>{ state.month=b.dataset.m; state.day=null; render(); });
  v.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{ state.day=b.dataset.d||null; render(); });

  const jt=v.querySelector("#f-today"); if(jt) jt.onclick=jumpToToday;
  v.querySelector("#f-spoil").onclick=()=>{ state.hideScores=!state.hideScores; state.revealed.clear(); store.set("nba_hide_scores",state.hideScores); render(); prefsChanged(); };
  const s=v.querySelector("#f-s"); s.oninput=e=>{ state.search=e.target.value; render(); const n=document.getElementById("f-s"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };

  if(any) mountBlocks(v.querySelector("#gamelist"), blocks);

/* Keep the selected month and the selected day (or today) in view inside the sideways-scrolling strips.
   First time a month is shown it scrolls there; later re-renders keep wherever you scrolled the strip to. */
let _strip={key:null, months:0, days:0};
function centerIn(strip,el){
  if(!strip||!el) return;
  const sr=strip.getBoundingClientRect(), er=el.getBoundingClientRect();
  strip.scrollLeft=Math.max(0, strip.scrollLeft+(er.left-sr.left)-(sr.width-er.width)/2);
}
function restoreStrips(v){
  const ms=v.querySelector(".months"), ds=v.querySelector(".days");
  const key=state.view+"|"+state.month+"|"+(state.day||"");
  if(key===_strip.key){
    if(ms) ms.scrollLeft=_strip.months;
    if(ds) ds.scrollLeft=_strip.days;
  }else{
    _strip.key=key;
    if(ms) centerIn(ms, ms.querySelector("button.on"));
    if(ds){
      const todayK=dateKey(Date.now(),state.region);
      const target=ds.querySelector("button.on[data-d]:not([data-d=''])")
        || ds.querySelector("button.today")
        || [...ds.querySelectorAll("button[data-d]")].find(b=>b.dataset.d && b.dataset.d>=todayK);
      if(target) centerIn(ds,target);
    }
  }
  const save=()=>{ _strip.months=ms?ms.scrollLeft:0; _strip.days=ds?ds.scrollLeft:0; };
  save();
  if(ms) ms.addEventListener("scroll",save,{passive:true});
  if(ds) ds.addEventListener("scroll",save,{passive:true});
}

/* The calendar follows the NBA's own (US Eastern) game days, so a late tip-off still belongs to the
   night it's played in the US — e.g. opening night 20 Oct shows 3 games. Times stay in your time zone. */
const US_TZ="America/New_York";
function groupByUSDay(games){
  const m=new Map();
  for(const g of games){ const k=dateKey(g.ms,US_TZ); (m.get(k)||m.set(k,[]).get(k)).push(g); }
  return m;
}
function usDayLabel(key){
  return new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",weekday:"short",day:"2-digit",month:"short",year:"numeric"})
    .format(new Date(Date.UTC(+key.slice(0,4), +key.slice(5,7)-1, +key.slice(8,10))));
}
function renderCalendar(){
  const groups=groupByUSDay(regularGames());
  if(!state.cal){
    // open on the current month if the season is on, otherwise the first month with games
    const nowK=dateKey(Date.now(),US_TZ);
    const has=[...groups.keys()].some(k=>k.startsWith(nowK.slice(0,7)));
    const base=has?nowK:([...groups.keys()].sort()[0]||nowK);
    state.cal={y:+base.slice(0,4), m:+base.slice(5,7)-1};
  }
  const {y,m}=state.cal;
  const todayK=dateKey(Date.now(),US_TZ);           // today's US game night
  const monthName=new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",month:"long",year:"numeric"}).format(new Date(Date.UTC(y,m,1)));
  const startDow=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7; // Monday first
  const days=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const dows=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<div class="cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const gs=groups.get(key)||[];
    const w=gs.filter(g=>state.watched.has(g.id)).length;
    const info=gs.length?`<span class="cnt">${dayCount(gs.length)}</span>${w?`<span class="w"><i></i>${w}</span>`:""}`:"";
    cells+=`<div class="cell${state.selDay===key?" sel":""}${key===todayK?" today":""}" data-day="${key}"><span class="dn">${d}</span>${info}</div>`;
  }
  // pad the last row so the border grid closes cleanly
  const used=startDow+days, pad=(7-(used%7))%7;
  for(let i=0;i<pad;i++) cells+=`<div class="cell blank"></div>`;

  let html=`<div class="calnav">
    <button id="prev" aria-label="Previous month">&lsaquo;</button>
    <span class="mlabel">${monthName}</span>
    <button id="next" aria-label="Next month">&rsaquo;</button>
    <button class="link" id="today">Today</button>
  </div>
  <p class="calnote">Game days follow US dates (ET) · tip-off times are in your time zone</p>
  <div class="grid">${dows.map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
  <div class="daypanel" id="daypanel"></div>`;
  const v=document.getElementById("view"); v.innerHTML=html;
  v.querySelector("#prev").onclick=()=>{ state.cal={y:m===0?y-1:y, m:(m+11)%12}; state.selDay=null; render(); };
  v.querySelector("#next").onclick=()=>{ state.cal={y:m===11?y+1:y, m:(m+1)%12}; state.selDay=null; render(); };
  v.querySelector("#today").onclick=()=>{ const k=dateKey(Date.now(),US_TZ); state.cal={y:+k.slice(0,4), m:+k.slice(5,7)-1}; state.selDay=k; render(); };
  v.querySelectorAll(".cell[data-day]").forEach(c=>c.onclick=()=>{ state.selDay=(state.selDay===c.dataset.day)?null:c.dataset.day; render(); });
  if(state.selDay){
    const gs=groups.get(state.selDay)||[];
    const panel=v.querySelector("#daypanel");
    panel.innerHTML=`<div class="dayhead"><span>${usDayLabel(state.selDay)} <span class="cnt">(US)</span></span><span class="cnt">${dayCount(gs.length)}</span></div>`
      + (gs.length?gs.map(gameRow).join(""):`<div class="empty">No games.</div>`);
    wireGames(panel);
  }
}

const BADGES=[

function tally(){
  const counts={}; TEAMS.forEach(t=>counts[t]=0);
  let total=0;
  for(const g of regularGames()){ if(state.watched.has(g.id)){ counts[g.away]++; counts[g.home]++; total++; } }
  const seen=TEAMS.filter(t=>counts[t]>0).length;
  return {counts,total,seen,eastSeen:EAST_T.filter(t=>counts[t]>0).length,westSeen:WEST_T.filter(t=>counts[t]>0).length};
}
function badgeState(){
  const s=tally(), out={};
  for(const b of BADGES){ const v=Math.min(b.val(s),b.goal); out[b.id]={v,done:v>=b.goal}; }
  return out;
}
let toastTimer=null;
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML=`<i></i><span></span>`; t.querySelector("span").textContent=msg; t.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.hidden=true; },3200);

  }
}

/* ---------- stats: high-resolution PNG export of games watched per team ---------- */
function _loadImg(src){
  return new Promise(res=>{
    if(!src) return res(null);
    const im=new Image(); im.crossOrigin="anonymous";
    const t=setTimeout(()=>res(null),5000);
    im.onload=()=>{ clearTimeout(t); res(im); };
    im.onerror=()=>{ clearTimeout(t); res(null); };      // no CORS -> fall back to a text chip (keeps canvas exportable)
    im.src=src+(src.includes("?")?"&":"?")+"x=1";
  });
}
function _drawMark(x,cx,cy,r,color){
  const k=r/150;
  x.save(); x.strokeStyle=color; x.lineWidth=24*k;
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke();
  x.fillStyle=color; x.beginPath();
  x.moveTo(cx-42*k,cy-80*k); x.lineTo(cx-42*k,cy+80*k); x.lineTo(cx+94*k,cy); x.closePath(); x.fill();
  x.restore();
}
function _fit(x,text,maxW){
  if(x.measureText(text).width<=maxW) return text;
  let t=text; while(t.length>1 && x.measureText(t+"…").width>maxW) t=t.slice(0,-1);
  return t+"…";
}
async function exportStatsPng(btn){
  const label=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="Exporting…"; }
  try{
    const s=tally();
    const rows=TEAMS.map(t=>[t,s.counts[t]]).sort((a,b)=>b[1]-a[1]||short(a[0]).localeCompare(short(b[0])));
    const cs=getComputedStyle(document.documentElement), C=(k,d)=>cs.getPropertyValue(k).trim()||d;
    const bg=C("--bg","#ffffff"), fg=C("--fg","#141414"), muted=C("--muted","#737373"), faint=C("--faint","#b0b0b0"),
          rule=C("--rule","#e4e4e4"), accent=C("--accent","#e03a2f"), accent2=C("--accent2","#f5b800"), chip=C("--chip","#efefef");
    try{ await document.fonts.ready; }catch(e){}
    const F='"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

    // layout in CSS px; rendered at 3x for a crisp ~3240px-wide image
    const W=1080, PAD=64, GAP=48, ROW=56, PER=15, FOOT=110, HEAD=PAD+224;
    const H=HEAD+PER*ROW+FOOT;
    const SCALE=Math.min(3, Math.sqrt(16e6/(W*H)));       // stay under mobile canvas-size limits
    const cv=document.createElement("canvas"); cv.width=Math.round(W*SCALE); cv.height=Math.round(H*SCALE);
    const x=cv.getContext("2d"); x.scale(SCALE,SCALE);
    x.fillStyle=bg; x.fillRect(0,0,W,H);

    // header: mark, season kicker, title
    _drawMark(x, PAD+28, PAD+30, 26, accent);
    x.textBaseline="alphabetic"; x.textAlign="left";
    x.fillStyle=muted; x.font=`500 18px ${F}`;
    x.fillText((document.getElementById("kicker")||{}).textContent||"NBA", PAD+76, PAD+20);
    x.fillStyle=fg; x.font=`600 44px ${F}`; x.fillText("My season so far", PAD+76, PAD+64);
    const uname=userName();
    if(uname){
      x.textAlign="right";
      x.fillStyle=accent; x.font=`600 28px ${F}`; x.fillText(_fit(x,"@"+uname,380), W-PAD, PAD+64);
      x.fillStyle=muted; x.font=`500 16px ${F}`; x.fillText("Watch tracker", W-PAD, PAD+20);
      x.textAlign="left";
    }

    // summary numbers
    const n=regularGames().length, pct=n?(s.total/n*100).toFixed(1):"0.0";
    let sx=PAD; const sy=PAD+144;
    for(const [num,lab] of [[String(s.total),"games watched"],[pct+"%","of the season"],[s.seen+"/30","teams seen"]]){
      x.fillStyle=fg; x.font=`600 40px ${F}`; x.fillText(num,sx,sy); sx+=x.measureText(num).width+10;
      x.fillStyle=muted; x.font=`400 18px ${F}`; x.fillText(lab,sx,sy); sx+=x.measureText(lab).width+40;
    }

    // section caption + rule
    x.fillStyle=muted; x.font=`500 14px ${F}`; x.fillText("GAMES WATCHED BY TEAM", PAD, PAD+196);
    x.fillStyle=fg; x.fillRect(PAD, PAD+208, W-2*PAD, 2);

    // team rows in two columns
    // local logos first (same-origin, always exportable), then ESPN, then a text chip
    const logos=await Promise.all(rows.map(([t])=>_loadImg(LOGO[ABBR[t]]).then(im=>im||_loadImg(LOGO_URLS[ABBR[t]]))));
    const max=Math.max(1,...rows.map(r=>r[1])), topV=rows[0][1];
    const colW=(W-2*PAD-GAP)/2;
    rows.forEach(([t,c],i)=>{
      const col=Math.floor(i/PER), r=i%PER;
      const cx=PAD+col*(colW+GAP), cy=HEAD+r*ROW+ROW/2;
      const zero=c===0;
      x.textBaseline="middle";
      x.fillStyle=faint; x.font=`500 16px ${F}`; x.textAlign="right"; x.fillText(String(i+1), cx+24, cy);
      x.textAlign="left";
      const im=logos[i];
      x.globalAlpha=zero?0.45:1;
      if(im){ x.drawImage(im, cx+34, cy-15, 30, 30); }
      else{ x.fillStyle=chip; x.fillRect(cx+34, cy-15, 30, 30); x.fillStyle=muted; x.font=`600 10px ${F}`; x.textAlign="center"; x.fillText(ABBR[t]||"", cx+49, cy+1); x.textAlign="left"; }
      x.globalAlpha=1;
      x.fillStyle=zero?muted:fg; x.font=`500 20px ${F}`;
      x.fillText(_fit(x,short(t),150), cx+74, cy);
      const barX=cx+234, barMax=colW-234-46;
      const bw=zero?0:Math.max(4, barMax*(c/max));
      if(bw){ x.fillStyle=(c===topV)?accent2:accent; x.fillRect(barX, cy-8, bw, 16); }
      x.fillStyle=zero?faint:fg; x.font=`${zero?400:600} 20px ${F}`; x.fillText(String(c), barX+bw+(bw?10:0), cy);
      x.fillStyle=rule; x.fillRect(cx, HEAD+(r+1)*ROW-1, colW, 1);
    });

    // footer
    x.textBaseline="alphabetic";
    const asOf=new Intl.DateTimeFormat("en-GB",{timeZone:state.region,day:"numeric",month:"short",year:"numeric"}).format(new Date());
    x.fillStyle=muted; x.font=`500 16px ${F}`; x.textAlign="left";
    x.fillText(`Watch tracker · as of ${asOf}`, PAD, H-PAD+14);
    x.textAlign="right"; x.fillText("A watched game counts for both teams.", W-PAD, H-PAD+14);

    const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
    if(!blob) throw new Error("export failed");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`nba-watch-tracker-${uname?uname+"-":""}${dateKey(Date.now(),state.region)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast("PNG saved");
  }catch(e){
    toast("Couldn't create the image — try again");
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=label||"Export PNG"; }
  }
}
function wireGames(root){
  root.querySelectorAll(".game[data-id]").forEach(el=>{
    el.onclick=e=>{
      const r=e.target.closest("[data-reveal]");
      if(r){ e.stopPropagation();
        const id=r.dataset.reveal; state.revealed.add(id);
        const g=state.games.find(x=>x.id===id), cell=el.querySelector(".score");
        if(g&&cell){ const tmp=document.createElement("div"); tmp.innerHTML=scoreCell(g,phase(g,Date.now())); const nn=tmp.firstElementChild; if(nn) cell.replaceWith(nn); }
        return;
      }
      openChooser(el,false);
    };
    el.onkeydown=e=>{ if(e.target===el && (e.key===" "||e.key==="Enter")){ e.preventDefault(); openChooser(el,true); } };
  });
}

/* ---------- render / tabs ---------- */
/* preseason = games before the regular-season opener (2026-10-20) */
let _regStartMs=null;
function isPreseason(g){
  if(_regStartMs===null) _regStartMs=etWallToUTCms("2026-10-20 00:00");
  return g.ms < _regStartMs;
}
function regularGames(){ return state.games.filter(g=>!isPreseason(g)); }
function viewGames(){
  if(state.view==="preseason") return state.games.filter(isPreseason);
  return regularGames();
}
function render(){
  if(_lazyObs){ _lazyObs.disconnect(); _lazyObs=null; }   // drop any prior lazy observer
  if(state.view==="list"||state.view==="preseason") renderList();
  else if(state.view==="calendar") renderCalendar();
  else renderStats();
}
function setView(v){
  state.view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  render();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
/* Preseason tab appears only while preseason is live; it hides once the regular season opens. */
function preseasonLive(){
  if(_regStartMs===null) _regStartMs=etWallToUTCms("2026-10-20 00:00");
  return state.games.some(isPreseason) && Date.now() < _regStartMs;
}
function updatePreseasonTab(){
  const btn=document.getElementById("tab-preseason");
  if(!btn) return;
  const show = preseasonLive();
  btn.hidden = !show;
  if(!show && state.view==="preseason") setView("list");
}

/* ---------- theme: light / dark toggle (top-right), with matching logo ---------- */
const SUN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>';
const MOON_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function effectiveTheme(){
  const f=document.documentElement.getAttribute("data-theme");
  if(f==="light"||f==="dark") return f;
  return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function updateThemeUI(){
  const t=effectiveTheme();
  /* logos are a single transparent mark now (no swap); favicon stays the dark tile (set in <head>) */
  const btn=document.getElementById("themebtn"); if(btn) btn.innerHTML = (t==="dark" ? SUN_SVG : MOON_SVG);
}
function applyTheme(t){
  const root=document.documentElement;
  root.classList.add("theme-anim");                 // enable smooth colour transitions just for the switch
  root.setAttribute("data-theme",t);
  store.set("nba_theme",t); updateThemeUI(); prefsChanged();
  clearTimeout(applyTheme._t);
  applyTheme._t=setTimeout(()=>root.classList.remove("theme-anim"),340);
}
function initTheme(){
  const saved=store.get("nba_theme",null);
  if(saved==="light"||saved==="dark") document.documentElement.setAttribute("data-theme",saved);
  updateThemeUI();
  const btn=document.getElementById("themebtn");
  if(btn) btn.onclick=()=>applyTheme(effectiveTheme()==="dark"?"light":"dark");
  if(window.matchMedia){ try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!document.documentElement.getAttribute("data-theme")) updateThemeUI(); }); }catch(e){} }
}

/* ---------- floating back-to-top ---------- */
function initToTop(){
  const btn=document.getElementById("totop");
  if(!btn) return;
  btn.onclick=()=>window.scrollTo({top:0, behavior:"smooth"});
  const onScroll=()=>btn.classList.toggle("show", window.scrollY>500);
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
}

/* Frozen header: full size at the top of the page, a slim single row once you scroll.
   A spacer takes up the height it gives back, so the page never jumps while it changes. */
function initHeader(){
  const bar=document.querySelector(".topbar");
  if(!bar) return;
  const spacer=document.createElement("div"); spacer.className="topspacer"; bar.after(spacer);
  let compact=false, fullH=bar.offsetHeight;
  const update=()=>{
    const y=window.scrollY;
    bar.classList.toggle("raised", y>4);
    if(!compact){
      fullH=bar.offsetHeight;
      if(y > fullH+60){
        bar.classList.add("compact"); compact=true;
        spacer.style.height=Math.max(0, fullH-bar.offsetHeight)+"px";
      }
    }else if(y < fullH+10){
      bar.classList.remove("compact"); compact=false; spacer.style.height="0px";
    }
  };
  window.addEventListener("scroll",update,{passive:true});
  window.addEventListener("resize",()=>{ if(compact){ bar.classList.remove("compact"); compact=false; spacer.style.height="0px"; } update(); });
  update();
}

function init(){
  initTheme();
  initToTop();
  initHeader();
  buildRegion();
  state.seed=loadSeed(); rebuildGames();
  setView(preseasonLive() ? "preseason" : "list"); setStatus();
  updatePreseasonTab();
  loadLiveSchedule();            // replace the embedded snapshot with the live schedule.json
  loadLogos();
  initAuthUI();
  initStore();
  setInterval(()=>{ setStatus(); const a=document.activeElement; if(state.view!=="stats" && !(a&&a.tagName==="INPUT")) render(); },60000);  // keep Live/Final and the Upcoming rule current
}
init();
